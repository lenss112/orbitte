:root{
  --bg:#0A0F2C; --surface:rgba(24,31,78,.72); --ink:#E9EBF7; --muted:#9AA1C9; --line:#2A336C;
  --field:#FFFFFF; --field-ink:#1A1D3A; --field-ph:#8A8FA8; --accent:#B9C0F5; --accent-ink:#0A0F2C; --danger:#FF8597;
  --irin:#FF6B81; --hane:#FFA45C; --remi:#9BDDF7; --sena:#F6F3FF;
  --sky:#0D1230; --sky-2:#1A2258; --sky-ink:#E9EBF7; --sky-muted:#A4ABD3; --sky-orbit:#3D4788;
  --sky-irin:#FF6B81; --sky-hane:#FFA45C; --sky-remi:#9BDDF7; --sky-sena:#F6F3FF;
  --bar:rgba(10,15,44,.86);
  --chorus:#C9A8FF;
  --unset:#6D7499;
  --chrome:linear-gradient(176deg,#FFFFFF 0%,#E4E9F8 34%,#8F9CCB 50%,#F4F6FC 66%,#B7C2E6 100%);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{background:var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1.2px 1.2px at 8% 12%,#fff9,transparent 60%),
    radial-gradient(1px 1px at 23% 34%,#fff7,transparent 60%),
    radial-gradient(1.4px 1.4px at 41% 8%,#fffb,transparent 60%),
    radial-gradient(1px 1px at 57% 27%,#fff6,transparent 60%),
    radial-gradient(1.2px 1.2px at 72% 15%,#fff9,transparent 60%),
    radial-gradient(1px 1px at 88% 38%,#fff7,transparent 60%),
    radial-gradient(1px 1px at 14% 58%,#fff6,transparent 60%),
    radial-gradient(1.3px 1.3px at 33% 71%,#fff8,transparent 60%),
    radial-gradient(1px 1px at 52% 52%,#fff5,transparent 60%),
    radial-gradient(1.2px 1.2px at 67% 66%,#fff8,transparent 60%),
    radial-gradient(1px 1px at 84% 79%,#fff6,transparent 60%),
    radial-gradient(1px 1px at 6% 88%,#fff7,transparent 60%),
    radial-gradient(1.3px 1.3px at 46% 92%,#fff9,transparent 60%),
    radial-gradient(1px 1px at 94% 6%,#fff7,transparent 60%),
    radial-gradient(120% 80% at 50% 0%,#1B2360 0%,transparent 70%),
    linear-gradient(180deg,#0A0F2C 0%,#101646 55%,#1A1C52 100%);
}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;background:transparent;color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;letter-spacing:-.01em;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 64px}
h1,h2,h3{font-family:inherit;font-weight:700;letter-spacing:-.02em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* sky */
.sky{position:relative;padding:2px 8px 14px !important;background:radial-gradient(120% 90% at 50% 40%,var(--sky-2),var(--sky));border:1px solid var(--line);color:var(--sky-ink);border-radius:28px;overflow:hidden;padding:8px 8px 22px}
.sky svg{display:block;width:100%;height:auto}
.orbitwrap{position:relative;margin-bottom:-6px}
.wordmark .bs{display:block;font-family:"Milesdane","Playfair Display",Georgia,serif;font-size:15px;letter-spacing:.03em;color:#FFFFFF;margin-top:-4px}
.wordmark{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-size:clamp(50px,14vw,80px);line-height:1;text-align:center;pointer-events:none}
.wm{position:relative;display:inline-block;font-family:"Milesdane","Playfair Display",Georgia,serif;font-style:normal;font-weight:400;letter-spacing:.01em;padding:0 .12em;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(120,150,255,.4))}
.spark{position:absolute;color:#AFC4FF;font-style:normal;line-height:1;filter:drop-shadow(0 0 6px #6F8BFF);-webkit-text-fill-color:#CFDBFF}
.spark.a{top:-.05em;right:-.18em;font-size:.34em}
.spark.b{bottom:.12em;left:-.22em;font-size:.22em}
.wordmark small{display:block;line-height:1.4;font-family:inherit;font-size:14px;letter-spacing:0;color:var(--sky-muted);margin-top:10px}
.members{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;padding:0 8px}
.mem{text-align:center;font-size:13px;color:var(--sky-muted);line-height:1.4}
.mem .nm{display:block;font-size:15px;color:var(--sky-ink)}
.mem .em,.mem .bd{display:block}
.mem .em{font-size:16px;margin:2px 0}
.mem .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:16px -16px 0;padding:10px 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--muted);cursor:pointer;font-size:15px}
nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

section{display:none;padding-top:12px}
section.on{display:block}
section > h2{font-size:22px;margin:4px 2px 4px}
.lead{color:var(--muted);font-size:14px;margin:0 2px 14px}


/* form */
form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:8px;margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,textarea{box-sizing:border-box;width:100%;max-width:100%;background:var(--field);color:var(--field-ink);color-scheme:light;border:1px solid transparent;border-radius:10px;padding:9px 11px;font-size:15px}
textarea{min-height:64px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--field-ph);opacity:1}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
.submit{justify-self:end;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 18px;cursor:pointer}
.submit:disabled{opacity:.45;cursor:not-allowed}

/* list */
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;position:relative}
.item h3{font-size:17px;padding-right:52px;word-break:break-word}
.item .meta{font-size:13px;color:var(--muted);margin-top:2px}
.item p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.item a.link{display:inline-block;margin-top:6px;color:var(--accent);word-break:break-all;font-size:14px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-right:6px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:16px;font-size:15px}
.filter{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.filter button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.filter button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}


.keybox{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;padding:24px;background:rgba(5,8,28,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.keycard{width:100%;max-width:340px;background:#141B46;border:1px solid var(--line);border-radius:24px;padding:26px 22px 20px;display:grid;gap:12px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45),0 0 40px rgba(120,150,255,.12);animation:pop .35s ease-out}
.keylogo{font-size:40px;line-height:1.1;margin-bottom:2px}
.keycard p{margin:0;font-size:15px}
.keycard input{text-align:center;font-size:16px}
.keycard .submit{justify-self:stretch;padding:11px}
.keycard small{color:var(--muted);font-size:12px}
#keyMsg:empty{display:none}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.keycard{animation:none}}
#keyMsg{color:var(--danger);font-size:14px}

/* setlist */
.setlist{background:var(--surface);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:20px;padding:14px 14px 10px;margin-top:16px}
.setlist h2{font-size:19px;margin:0 2px 2px}
.setlist .lead{margin-bottom:10px}
.setlist ol{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:6px}
.setlist li{counter-increment:s;display:flex;align-items:center;gap:10px}
.setlist li::before{content:"M" counter(s);flex:none;width:34px;font-family:"Noto Sans KR","Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:15px;font-weight:500;color:var(--muted);text-align:right}
.setlist li input{flex:1}
.setlist li .x{flex:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;width:28px;height:28px}
.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;color:var(--muted);font-size:12px;padding:6px 8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.setlist li input{min-width:0}
.setlist.viewing li.song{display:flex;align-items:center;gap:10px}
.setlist.viewing li.song .nm{flex:1;min-width:0}
.setlist li.mc{counter-increment:none}
.setlist li.mc::before{content:"MC"}

    <div class="orbitwrap">
      <svg id="orbit" viewBox="0 44 360 148" role="img" aria-label="네 멤버가 각자의 궤도를 도는 그림"></svg>
      <div class="wordmark"><span class="wm">ORBITte</span><span class="bs">Backstage</span></div>
    </div>
    <div class="members" id="memberStrip"></div>
  </header>

  <div class="setlist" id="setBox">
    <button class="setfold" id="setFold" aria-expanded="false" aria-controls="setInner">
      <h2 class="setttl">Setlist</h2>
      <span class="setsum" id="setSum"></span>
      <span class="chev" aria-hidden="true">⌄</span>
    </button>
    <div id="setInner" hidden>
    <div class="showtabs" id="showTabs"></div>
    <div id="setHead"></div>
    <ol id="setlist"></ol>
    <button class="add" id="addSlot">칸 추가</button>
    <div class="saved" id="setSaved"></div>
    <div class="settoggle"><button id="setImg" class="textbtn" hidden>이미지 저장</button><button id="setToggle" class="textbtn" hidden></button></div>
    </div>
  </div>


  <div class="notice" id="notice" role="status" aria-live="polite"></div>
  <div class="keybox" id="keyBox" role="dialog" aria-modal="true" aria-labelledby="keyTitle">
    <div class="keycard">
      <div class="keylogo"><span class="wm">ORBITte</span></div>
      <p id="keyTitle">팀 비밀번호 입력</p>
      <input id="keyInput" type="password" placeholder="비밀번호" autocomplete="current-password" enterkeyhint="go">
      <button class="submit" id="keyGo">들어가기</button>
      <span id="keyMsg"></span>
      <small>한 번 입력하면 이 기기에 저장됨</small>
    </div>
  </div>

  <nav aria-label="메뉴">
    <button data-tab="regs">공지</button>
    <button data-tab="design">디자인</button>
    <button data-tab="songs">곡</button>
    <button data-tab="parts">확정곡</button>
    <button data-tab="members">팀 정보</button>
  </nav>

  <section id="design">
    <div class="sechead"><h2>디자인 레퍼런스</h2><button class="opener" data-open="design" aria-expanded="false">+ 올리기</button></div>
    <p class="lead">의상, 무대, 굿즈, SNS 참고 사진과 링크</p>
    <form data-col="design" hidden>
      <div class="row">
        <input name="title" placeholder="제목 (예: 앵콜 의상 별자리 패턴)" required maxlength="80">
        <select name="author" class="ausel" required><option value="">작성자</option><option value="irin">❤️ 아이린</option><option value="hane">🧡 하네</option><option value="remi">🩵 레미</option><option value="sena">🤍 세나</option></select>
      </div>
      <div class="row">
        <select name="kind"><option>의상</option><option>무대</option><option>굿즈</option><option>SNS</option><option>헤어·메이크업</option><option>기타</option></select>
        <input name="url" type="text" inputmode="url" autocapitalize="off" placeholder="링크 (선택)">
      </div>
      <textarea name="note" placeholder="메모 (선택)" maxlength="1000"></textarea>
      <label class="photopick" id="photoPick"><span>사진 추가 (최대 4장)</span><input name="photos" type="file" accept="image/*" multiple></label>
      <div class="photoprev" id="photoPrev"></div>
      <button class="submit">올리기</button>
    </form>
    <div class="filter" data-filter="design"></div>
    <div class="sortrow"><button class="sortbtn" data-col="design" aria-expanded="false" aria-haspopup="true">정렬</button><div class="sortmenu" data-col="design" hidden></div></div>
    <div class="list" id="list-design"></div>
  </section>

  <section id="songs">
    <div class="sechead"><h2>곡 레퍼런스</h2><button class="opener" data-open="songs" aria-expanded="false">+ 올리기</button></div>
    <p class="lead">커버 후보, 안무 참고, 분위기 참고 곡 모음</p>
    <form data-col="songs" hidden>
      <div class="row">
        <input name="title" placeholder="곡명" required maxlength="80">
        <input name="artist" placeholder="아티스트" maxlength="60">
      </div>
      <div class="row">
        <select name="kind"><option>커버 후보</option><option>안무 참고</option><option>분위기 참고</option><option>기타</option></select>
        <input name="url" type="text" inputmode="url" autocapitalize="off" placeholder="링크 (선택)">
      </div>
      <select name="author" class="ausel" required><option value="">작성자</option><option value="irin">❤️ 아이린</option><option value="hane">🧡 하네</option><option value="remi">🩵 레미</option><option value="sena">🤍 세나</option></select>
      <textarea name="note" placeholder="메모 (선택)" maxlength="1000"></textarea>
      <button class="submit">올리기</button>
    </form>
    <div class="filter" data-filter="songs"></div>
    <div class="sortrow"><button class="sortbtn" data-col="songs" aria-expanded="false" aria-haspopup="true">정렬</button><div class="sortmenu" data-col="songs" hidden></div></div>
    <div class="list" id="list-songs"></div>
  </section>

  <section id="parts">
    <div class="sechead"><h2>확정곡</h2><button class="opener" data-open="parts" aria-expanded="false">+ 추가</button></div>
    <p class="lead">공연에서 부르기로 확정한 곡과 파트 분배. 줄마다 멤버 색을 고르고 "파트 확정", 여러 명은 합창 색으로 표시</p>
    <form data-col="parts" hidden>
      <div class="row">
        <input name="title" id="ptTitle" placeholder="곡명 (일본어)" required maxlength="80">
        <input name="title_ko" id="ptTitleKo" placeholder="곡명 (한국어)" maxlength="80">
      </div>
      <div class="row">
        <input name="artist" placeholder="아티스트" maxlength="60">
        <select name="lang" id="langSel"><option value="ja">일본곡</option><option value="ko">한국곡</option></select>
      </div>
      <textarea name="lyrics" id="lyricsBox" placeholder="일본어&#10;뜻&#10;발음&#10;(3줄씩 반복, 한 줄 안에서 파트가 바뀌면 그 자리에 /)" required maxlength="12000" style="min-height:140px"></textarea>
      <button class="submit">곡 추가</button>
    </form>
    <div class="legend" id="legend"></div>
    <div class="list" id="list-parts"></div>
  </section>

  <section id="regs">
    <div class="sechead"><h2>공지</h2><button class="opener" data-open="regs" aria-expanded="false">+ 쓰기</button></div>
    <p class="lead">멤버 공지</p>
    <form data-col="regs" hidden>
      <select name="cat"><option>공지</option><option>토론</option><option>레귤레이션</option></select>
      <input name="title" placeholder="제목 (예: 정산 비율 확정)" required maxlength="80">
      <textarea name="text" placeholder="내용 (선택)" maxlength="2000"></textarea>
      <button class="submit">올리기</button>
    </form>
    <div class="filter" data-filter="regs"></div>
    <div class="list" id="list-regs"></div>
  </section>

  <section id="members">
    <h2>팀 정보</h2>
    <div id="list-members"></div>
  </section>

</div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="디자인 레퍼런스 보기">
  <div class="lbpanel">
    <div class="lbbar"><button class="textbtn" id="lbClose">닫기</button></div>
    <div class="lbcar"><div class="lbimgs" id="lbImgs"></div><button class="lbarrow prev" id="lbPrev" aria-label="이전 사진">‹</button><button class="lbarrow next" id="lbNext" aria-label="다음 사진">›</button><div class="lbdots" id="lbDots"></div></div>
    <div class="lbinfo" id="lbInfo"></div>
  </div>
</div>
<script>
/* ===== 설정 =====
   GitHub 버전: Apps Script 웹 앱 주소를 붙여넣으세요.
   비워 두면 claude.ai 저장소를 써요. */
const API = "https://script.google.com/macros/s/AKfycbyg-Fo65bNcj3xfZyZ4MeoYz8C12Uz2rOSIZKdVO13tG9qOW5S5JHeAFMv9nDAexQsQ/exec";

const M = {
  irin:{name:"아이린",heart:"❤️",emoji:"📮",bd:"0527",c:"--irin",sc:"--sky-irin"},
  hane:{name:"하네",heart:"🧡",emoji:"🪶",bd:"0926",c:"--hane",sc:"--sky-hane"},
  remi:{name:"레미",heart:"🩵",emoji:"🐿️",bd:"0614",c:"--remi",sc:"--sky-remi"},
  sena:{name:"세나",heart:"🤍",emoji:"🎀",bd:"0106",c:"--sena",sc:"--sky-sena"}
};
const KEYS = Object.keys(M);
const COLS = ["design","songs","parts","regs","comments"];
const KVS = ["setlist","profiles"];
const ASC = new Set(["parts","comments"]);
const $ = s => document.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = new Date(); const TODAY = ymd(today);
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const safeUrl = u => { u = String(u || "").trim(); if (!u) return null; if (/^https?:\/\//i.test(u)) return u; if (/^[^\s:]+\.[^\s]+$/.test(u)) return "https://" + u.replace(/^\/+/,""); return null; };
const fmtDate = ts => { const d = new Date(ts); return `${d.getMonth()+1}월 ${d.getDate()}일`; };
let noticeT = null;
const notice = msg => { const n = $("#notice"); clearTimeout(noticeT); n.textContent = msg; n.classList.toggle("show", !!msg); if (msg) noticeT = setTimeout(() => n.classList.remove("show"), 4000); };
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} };

/* ===== 상태 ===== */
const data = {design:[],songs:[],parts:[],regs:[],comments:[]};
const kv = {setlist:{shows:[]}, profiles:{}};
const sortCol = (col, arr) => arr.slice().sort((a,b) => ASC.has(col) ? (a.createdAt||0)-(b.createdAt||0) : (b.createdAt||0)-(a.createdAt||0));
let store = null, canWrite = true;
const writable = () => !!store && canWrite;
const fail = () => notice("저장 실패. 연결 확인 후 다시 시도");

/* 입력 중인 칸은 다시 그리지 않고, 다 쓰고 나가면 그려요 */
function guard(box, fn){
  const a = document.activeElement;
  if (box && a && box.contains(a) && a.matches("input:not([type=file]),textarea,select")) {
    if (!box.dataset.dirty) { box.dataset.dirty = "1"; box.addEventListener("focusout", function h(){ setTimeout(() => { if (!box.contains(document.activeElement)) { box.removeEventListener("focusout", h); delete box.dataset.dirty; fn(); } }, 0); }); }
    return;
  }
  fn();
}

/* ===== 메인 ===== */

KEYS.forEach(k => {
  const m = M[k], d = el("div","mem");
  d.append(el("span","nm",`${m.heart} ${m.name}`), el("span","em",m.emoji), el("span","bd",`${+m.bd.slice(0,2)}월 ${+m.bd.slice(2)}일`));
  $("#memberStrip").append(d);
});

(function orbit(){
  const svg = $("#orbit"), NS = "http://www.w3.org/2000/svg";
  const mk = (t,a) => { const e = document.createElementNS(NS,t); for (const k in a) e.setAttribute(k,a[k]); return e; };
  let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  for (let i=0;i<70;i++) svg.append(mk("circle",{cx:rnd()*360,cy:rnd()*230,r:rnd()*1.1+.2,fill:"var(--sky-ink)",opacity:(rnd()*.5+.15).toFixed(2)}));
  const cx=180, cy=118;
  const g = mk("g",{transform:`rotate(-14 ${cx} ${cy})`}); svg.append(g);
  const orbits = KEYS.map((k,i) => ({k, rx:56+i*34, ry:(56+i*34)*.36, speed:.00022/(1+i*.55), phase:i*1.7}));
  orbits.forEach(o => g.append(mk("ellipse",{cx,cy,rx:o.rx,ry:o.ry,fill:"none",stroke:"var(--sky-orbit)","stroke-width":1})));
  const defs = mk("defs",{}); svg.prepend(defs);
  KEYS.forEach(k => {
    const rg = mk("radialGradient",{id:`glow-${k}`});
    [[0,.75],[.18,.55],[.45,.2],[1,0]].forEach(([o,a]) => { const st = mk("stop",{offset:o}); st.setAttribute("style",`stop-color:var(${M[k].sc});stop-opacity:${a}`); rg.append(st); });
    defs.append(rg);
  });
  const stars = orbits.map(o => {
    const s = mk("g",{});
    s.append(mk("circle",{r:10.5,fill:`url(#glow-${o.k})`}));
    s.append(mk("circle",{r:3.8,fill:`var(${M[o.k].sc})`}));
    g.append(s); return {o,s};
  });
  const place = t => stars.forEach(({o,s}) => { const a = o.phase + t*o.speed; s.setAttribute("transform",`translate(${(cx+o.rx*Math.cos(a)).toFixed(1)} ${(cy+o.ry*Math.sin(a)).toFixed(1)})`); });
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { place(0); return; }
  const loop = t => { place(t); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
})();

/* ===== 세트리스트 ===== */
let setTimer = null;
let setEditing = false, selShow = null, setOpen = false, pastOpen = false;
function openSet(v){ if (!v) { selShow = null; setEditing = false; pastOpen = false; } setOpen = v; $("#setInner").hidden = !v; $("#setFold").setAttribute("aria-expanded", String(v)); $("#setBox").classList.toggle("open", v); }
$("#setFold").onclick = () => openSet(!setOpen);
const KIND = {ori:"Original", cover:"Cover"};
const normItems = arr => (arr || []).map(v => typeof v === "string" ? {n:v, k:""} : {n:v?.n || "", k:v?.k || ""});
function shows(){
  let sl = kv.setlist || {};
  if (sl._ok) return sl.shows;
  if (!Array.isArray(sl.shows)) { const it = normItems(sl.items); sl = {shows: it.some(v => v.n.trim() || v.k) ? [{id:"s0", title:"", date:"", items:it}] : []}; }
  sl = {_ok:true, shows: sl.shows.map(s => ({id:s.id || newId(), concept:s.concept || "", date:s.date || "", items:normItems(s.items)}))};
  kv.setlist = sl; return sl.shows;
}
const dkey = s => s.date || "9999-99-99";
const byDate = (a,b) => dkey(a) < dkey(b) ? -1 : dkey(a) > dkey(b) ? 1 : 0;
function pickDefault(list){
  const up = list.filter(s => s.date && s.date >= TODAY).sort(byDate)[0];
  if (up) return up.id;
  const past = list.filter(s => s.date).sort(byDate).pop();
  return (past || list[0])?.id || null;
}
function curShow(){ const l = shows(); if (!l.find(s => s.id === selShow)) selShow = pickDefault(l); return l.find(s => s.id === selShow) || null; }
const md = d => `${+d.slice(0,4) !== today.getFullYear() ? d.slice(0,4) + "년 " : ""}${+d.slice(5,7)}월 ${+d.slice(8)}일`;
const showLabel = s => s.date ? `${s.date.slice(2,4)}/${s.date.slice(5,7)}/${s.date.slice(8,10)}` : "날짜 미정";
function renderSet(){
  const boxEl = $("#setBox");
  guard(boxEl, () => {
    boxEl.querySelectorAll(".showdel").forEach(e => e.remove());
    const list = shows().slice().sort(byDate), cur = curShow();
    const tabs = $("#showTabs"); tabs.innerHTML = "";
    const chip = (s, cls) => {
      const b = el("button", cls || null, showLabel(s)); b.setAttribute("aria-pressed", String(s.id === selShow));
      b.onclick = () => { selShow = s.id; setEditing = false; renderSet(); };
      return b;
    };
    const past = list.filter(x => x.date && x.date < TODAY).reverse(), upcoming = list.filter(x => !x.date || x.date >= TODAY);
    upcoming.forEach(x => tabs.append(chip(x)));
    if (past.length) {
      if (past.some(x => x.id === selShow)) pastOpen = true;
      const pb = el("button","pasttoggle", `지난 공연 ${past.length} ${pastOpen ? "▴" : "▾"}`); pb.setAttribute("aria-expanded", String(pastOpen));
      pb.onclick = () => { pastOpen = !pastOpen; renderSet(); };
      tabs.append(pb);
    }
    if (writable()) {
      const add = el("button","addshow","+ 공연");
      add.onclick = () => { shows(); const s = {id:newId(), concept:"", date:"", items:Array.from({length:6}, () => ({n:"", k:""}))}; kv.setlist.shows.push(s); selShow = s.id; setEditing = true; saveSet(); renderSet(); };
      tabs.append(add);
    }
    tabs.hidden = !tabs.childElementCount;
    let pr = $("#pastTabs");
    if (!pr) { pr = el("div","showtabs pasttabs"); pr.id = "pastTabs"; tabs.after(pr); }
    pr.innerHTML = ""; pr.hidden = !(past.length && pastOpen);
    if (past.length && pastOpen) past.forEach(x => pr.append(chip(x, "past")));
    const ol = $("#setlist"), head = $("#setHead"); ol.innerHTML = ""; head.innerHTML = "";
    const items = cur ? cur.items : [], filled = items.filter(v => v.n.trim() || v.k === "mc");
    const editing = !!(writable() && cur && (setEditing || !filled.length));
    boxEl.classList.toggle("viewing", !editing);
    $("#addSlot").hidden = !editing; $("#setSaved").hidden = !editing;
    const tg = $("#setToggle");
    tg.hidden = !(writable() && cur);
    tg.textContent = editing ? "완료" : "세트리스트 수정";
    tg.className = editing ? "submit" : "textbtn";
    $("#setImg").hidden = editing || !cur || !filled.length;
    const sum = $("#setSum");
    const near = list.find(x => x.id === pickDefault(list));
    const nearN = near ? near.items.filter(v => v.n.trim() && v.k !== "mc").length : 0;
    sum.textContent = near ? [showLabel(near), nearN ? `${nearN}곡` : ""].filter(Boolean).join("  ") : "";
    if (editing && setOpen === false && setEditing) openSet(true);
    if (!cur) { ol.append(el("li","none", writable() ? "+ 공연을 눌러 세트리스트 만들기" : "아직 정해진 세트리스트 없음")); return; }
    if (!editing) {
      if (cur.date) head.append(el("div","showhead", md(cur.date)));
      if (cur.concept) head.append(el("div","showconcept", cur.concept));
      if (!filled.length) { ol.append(el("li","none","아직 정해진 세트리스트 없음")); return; }
      filled.forEach((v,fi) => {
        const li = el("li","song" + (v.k === "mc" ? " mc" : "")); li.dataset.i = fi; li.append(el("span","nm",v.n.trim() || (v.k === "mc" ? "토크" : "")));
        if (KIND[v.k]) li.append(el("span","kind " + v.k, KIND[v.k]));
        ol.append(li);
      });
      return;
    }
    const hr = el("div","showedit"), t = el("input"), d = el("input");
    t.placeholder = "컨셉 (간단히)"; t.maxLength = 80; t.value = cur.concept;
    d.type = "date"; d.value = cur.date; d.setAttribute("aria-label","공연 날짜");
    t.oninput = () => { setEditing = true; const c = curShow(); if (c) { c.concept = t.value; queueSave(); } };
    d.onchange = () => {
      setEditing = true; const c = curShow();
      if (c) { c.date = d.value; saveSet(); }
      if (d.value && d.value < TODAY) notice(`${d.value.slice(0,4)}년 ${+d.value.slice(5,7)}월 ${+d.value.slice(8)}일은 지난 날짜. 내년 공연이면 연도 확인 필요`);
    };
    const del = el("button","textbtn","이 공연 삭제");
    del.onclick = () => { if (!confirm("정말 삭제하시겠습니까?")) return; shows(); kv.setlist.shows = kv.setlist.shows.filter(s => s.id !== cur.id); selShow = null; setEditing = false; saveSet(); renderSet(); };
    hr.append(d, t); head.append(hr);
    items.forEach((v,i) => {
      const li = el("li", "erow" + (v.k === "mc" ? " mc" : "")), inp = el("input"); li.dataset.i = i; inp.value = v.n; inp.placeholder = v.k === "mc" ? "토크 내용 (선택)" : "곡명"; inp.maxLength = 80;
      inp.setAttribute("aria-label", `${i+1}번째 곡`);
      inp.oninput = () => { setEditing = true; const c = curShow(); if (c && c.items[i]) { c.items[i].n = inp.value; queueSave(); } };
      const seg = el("span","seg");
      [["ori","오리"],["cover","커버"],["mc","MC"]].forEach(([k,label]) => {
        const b = el("button",null,label); b.setAttribute("aria-pressed", String(v.k === k));
        b.setAttribute("aria-label", `${i+1}번째 칸 ${{오리:"오리곡",커버:"커버곡",MC:"MC 토크"}[label]}`);
        b.onclick = () => { setEditing = true; const c = curShow(); if (c && c.items[i]) { c.items[i].k = v.k === k ? "" : k; saveSet(); renderSet(); } };
        seg.append(b);
      });
      const x = el("button","x","×"); x.setAttribute("aria-label",`${i+1}번째 칸 지우기`);
      x.onclick = () => { const c = curShow(); if (c) { c.items.splice(i,1); saveSet(); renderSet(); } };

        if (j !== idx) return l;
        const n = splitSeg(l.t).length;
        if (n > 1) { const s = Array.from({length:n}, (_,q) => [...((l.s || [])[q] || [])]); s[si] = s[si].includes(k) ? s[si].filter(x => x !== k) : [...s[si], k]; return {...l, s}; }
        const w = l.w || []; return {...l, w: w.includes(k) ? w.filter(x => x !== k) : [...w, k]};
      });
      store.update("parts", p.id, {lines:nl}).catch(fail);
    };
    const picker = (idx, si, arr, label) => {
      const ws = el("span","ws");
      KEYS.forEach(k => {
        const b = el("button","wbtn"); b.style.setProperty("--c", `var(${M[k].c})`);
        b.setAttribute("aria-pressed", String(arr.includes(k))); b.setAttribute("aria-label", `${label} ${M[k].name}`);
        b.onclick = () => toggle(idx, si, k); ws.append(b);
      });
      return ws;
    };
    const ls = el("div","lines" + (ja ? " ja" : ""));
    lines.forEach((ln,idx) => {
      const ass = assignsOf(ln), segs = splitSeg(ln.t), row = el("div","line");
      const tx = el("span","t");
      tx.append(lineBlock(ln.t, ass, "main"));
      if (ja) {
        [ln.m, ln.p].forEach(sub => {
          if (!sub) return;
          const ss = splitSeg(sub);
          if (ss.length === segs.length) tx.append(lineBlock(sub, ass, "sub"));
          else { const one = ass.every(a => a.join() === ass[0].join()) ? ass[0] : []; tx.append(lineBlock(sub.replace(/\s*\/\s*/g," "), [one], "sub")); }
        });
      }
      row.append(tx);
      if (editing && segs.length === 1) row.append(picker(idx, 0, ass[0], `${idx+1}번째 ${ja ? "세트" : "줄"}`));
      ls.append(row);
      if (editing && segs.length > 1) {
        segs.forEach((sg, q) => {
          const sr = el("div","line segrow"); sr.append(el("span","t segname", `${q+1}. ${sg}`), picker(idx, q, ass[q], `${idx+1}번째 줄 ${q+1}번째 부분`));
          ls.append(sr);
        });
      }
    });
    const foot = el("div","partfoot");
    if (writable()) {
      const le = el("button","textbtn","곡·가사 수정"); le.onclick = () => { lyricEditing.add(p.id); renderParts(); }; foot.append(le);
      const dl = el("button","textbtn","곡 삭제"); dl.onclick = () => { if (!confirm("정말 삭제하시겠습니까?")) return; store.remove("parts", p.id).catch(fail); }; foot.append(dl);
      const t = el("button", editing ? "submit" : "textbtn", editing ? "파트 확정" : "파트 수정");
      t.onclick = () => {
        if (editing) { partEditing.delete(p.id); store.update("parts", p.id, {locked:true}).catch(fail); }
        else { partEditing.add(p.id); renderParts(); }
      };
      foot.append(t);
    }
    if (foot.childElementCount) d.append(foot);
    d.append(ls); box.append(d);
  });
  });
}
const partEditing = new Set();

/* 팀 정보 */
const TEAM_SNS = [
  ["YouTube", "@ORBITte_OFCL", "https://www.youtube.com/@ORBITte_OFCL"],
  ["X", "@ORBITte_OFCL", "https://x.com/ORBITte_OFCL"]

const listId = u => { const m = String(u || "").match(/[?&]list=([\w-]+)/) || String(u || "").match(/^(PL[\w-]+|UU[\w-]+)$/); return m ? m[1] : ""; };
const profEditing = new Set();
const snsIcon = l => /youtube|유튜브/i.test(l) ? "▶" : /^x\b|트위터|twitter/i.test(l) ? "𝕏" : /insta|인스타/i.test(l) ? "◎" : /tiktok|틱톡/i.test(l) ? "♪" : "🔗";
const snsName = l => /^유튜브$/.test(l) ? "YouTube" : /^X \(트위터\)$/.test(l) ? "X" : l;
function renderMembers(){

        rows.forEach((t,i) => {

          const b = el("input"); b.value = t.handle || ""; b.placeholder = "표시 (예: @ORBITte_OFCL)"; b.oninput = () => t.handle = b.value;
          const c = el("input"); c.value = t.url || ""; c.placeholder = "링크 (선택)"; c.inputMode = "url"; c.autocapitalize = "off"; c.oninput = () => t.url = c.value;
          const x = el("button","textbtn","빼기"); x.onclick = () => { rows.splice(i,1); draw(); };
          r.append(a, b, c, x); list.append(r);

      };
      draw();

      const pl = el("input"); pl.value = prof.playlist ?? DEFAULT_PLAYLIST; pl.placeholder = "유튜브 재생목록 링크"; pl.inputMode = "url"; pl.autocapitalize = "off";

        store.setKV("profiles", {...(kv.profiles||{}), team:out, playlist:pl.value.trim()}).catch(fail);

    } else {

        const a = el(u ? "a" : "div", u ? "go" : null); if (u) { a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; a.setAttribute("aria-label", `${nm} ${t.handle || ""} 열기`); }
        const left = el("span","tleft"); left.append(el("span","ticon", snsIcon(nm)), el("span","tlabel", nm));
        const right = el("span","tright"); right.append(el("span","thandle", t.handle || t.url || "")); if (u) right.append(el("span","tarrow","↗"));
        a.append(left, right); tl.append(a);
      });
      if (!team.length) tl.append(el("span","muted","아직 팀 정보 없음"));
      tc.append(tl);
      if (writable()) { const e = el("button","textbtn","수정"); e.style.justifySelf = "end"; e.onclick = () => { profEditing.add("team"); renderMembers(); }; tc.append(e); }
    }
    box.append(tc);

    if (lid && !profEditing.has("team")) {

        fr = el("div","yt");

        ifr.title = "오르비테 스테이지 재생목록"; ifr.loading = "lazy"; ifr.referrerPolicy = "strict-origin-when-cross-origin";
        ifr.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"; ifr.allowFullscreen = true;
        fr.append(ifr); box._frame = fr; box.dataset.lid = lid;
      }
      const a = el("a","ytlink","유튜브에서 재생목록 열기 ↗"); a.href = `https://www.youtube.com/playlist?list=${encodeURIComponent(lid)}`; a.target = "_blank"; a.rel = "noopener noreferrer";

const langSel = $("#langSel");
if (langSel) langSel.onchange = () => {

  $("#lyricsBox").placeholder = ja ? "일본어\n뜻\n발음\n(3줄씩 반복, 한 줄 안에서 파트가 바뀌면 그 자리에 /)" : "가사 (한 줄에 한 파트씩, 한 줄 안에서 파트가 바뀌면 그 자리에 /)";
  $("#ptTitle").placeholder = ja ? "곡명 (일본어)" : "곡명"; $("#ptTitleKo").hidden = !ja; if (!ja) $("#ptTitleKo").value = "";
};

/* 사진 줄이기 + 미리보기 */
async function shrink(file){
  const url = URL.createObjectURL(file), img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej({code:"이 형식의 사진은 읽을 수 없음 (HEIC면 JPG로 바꿔서)"}); img.src = url; });
  const sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg", .85).split(",")[1];
}
const photoIn = document.querySelector('#photoPick input');
function showPrev(){
  const box = $("#photoPrev"); box.querySelectorAll("img").forEach(i => URL.revokeObjectURL(i.src)); box.innerHTML = "";
  const files = [...(photoIn?.files || [])];
  if (files.length > 4) notice("사진은 4장까지, 앞의 4장만 올라감");
  files.slice(0,4).forEach(fl => { const i = el("img"); i.src = URL.createObjectURL(fl); i.alt = ""; box.append(i); });
  $("#photoPick span").textContent = files.length ? `사진 ${Math.min(files.length,4)}장 선택됨` : "사진 추가 (최대 4장)";
}
if (photoIn) photoIn.onchange = showPrev;

/* 작성란 열고 닫기 */
function setForm(col, open){
  const f = document.querySelector(`form[data-col="${col}"]`), b = document.querySelector(`.opener[data-open="${col}"]`);
  if (!f || !b) return;
  f.hidden = !open; b.hidden = open; b.setAttribute("aria-expanded", String(open));
  if (open) {
    const fv = filters[col], sel = f.querySelector('select[name="cat"],select[name="kind"]');
    if (sel && fv && fv !== "전체" && [...sel.options].some(o => o.value === fv)) sel.value = fv;
    const first = f.querySelector("input:not([type=file]),textarea"); if (first) setTimeout(() => first.focus(), 30);
  }
}
document.querySelectorAll(".opener").forEach(b => b.onclick = () => setForm(b.dataset.open, true));
document.querySelectorAll("form[data-col]").forEach(f => {
  const c = el("button","textbtn formclose","닫기"); c.type = "button"; c.onclick = () => setForm(f.dataset.col, false);
  const sub = f.querySelector(".submit"); const row = el("div","formfoot"); sub.replaceWith(row); row.append(c, sub);
});

/* 그리기 */
function paint(col){
  if (col === "design" || col === "songs") renderRefs(col);
  else if (col === "regs" || col === "comments") renderNotices();
  else if (col === "parts") renderParts();
}
function paintKV(k){
  if (k === "setlist") renderSet();
  else if (k === "profiles") renderMembers();
}
function paintAll(){ COLS.forEach(paint); KVS.forEach(paintKV); updateSubmit(); const pp = $("#photoPick"); if (pp) pp.hidden = !(store && store.upload); }

/* 글쓰기 */
document.querySelectorAll("form[data-col]").forEach(f => f.addEventListener("submit", async ev => {
  ev.preventDefault();
    if (!writable()) return;
  const col = f.dataset.col, fd = new FormData(f), row = {createdAt:Date.now()};
  for (const [k,v] of fd.entries()) if (typeof v === "string") row[k] = v.trim();
  if (col === "parts") {
    const raw = row.lyrics.split("\n").map(s => s.trim()).filter(Boolean);
    if (row.lang === "ja") {
      if (raw.length % 3) { notice(`일본곡은 일본어, 뜻, 발음 3줄씩. 지금 ${raw.length}줄이라 마지막 세트가 ${raw.length % 3}줄뿐, 확인 필요`); return; }
      row.lines = [];
      for (let i = 0; i < raw.length && row.lines.length < 200; i += 3) row.lines.push({t:raw[i], m:raw[i+1], p:raw[i+2], w:[]});
    } else row.lines = raw.slice(0,200).map(t => ({t, w:[]}));
    row.locked = false;
    delete row.lyrics;
    if (!row.lines.length) { notice("가사를 한 줄 이상 입력"); return; }
  }
  if (col === "design" && store.upload) {
    const files = [...(f.querySelector('input[type="file"]')?.files || [])].slice(0,4);
    if (files.length) {
      const btn = f.querySelector(".submit"); btn.disabled = true; row.images = [];
      try {
        for (let i = 0; i < files.length; i++) { btn.textContent = `사진 올리는 중 ${i+1}/${files.length}`; row.images.push(await store.upload(files[i])); }
      } catch(e) { notice(`사진 올리기 실패 (${e.detail || e.code || e.message || "알 수 없음"})`); btn.textContent = "올리기"; updateSubmit(); return; }
      btn.textContent = "올리기"; updateSubmit();
    }
  }
  notice(""); f.reset(); setForm(col, false); if (col === "design") showPrev(); if (col === "parts" && langSel) langSel.onchange();
  f.querySelectorAll("select.ausel").forEach(sel => { const v = lsGet("orbitte-author"); if (M[v]) sel.value = v; });
  store.add(col, row).catch(e => notice(e?.code === "quota_exceeded" ? "저장 공간 가득 참. 오래된 항목 삭제 필요" : "저장 실패. 잠시 후 다시 시도"));
}));

/* ===== 저장소: 구글 스프레드시트 ===== */
let teamKey = lsGet("orbitte-key") || "";
function makeSheetStore(){
  let queue = Promise.resolve(), pending = 0;
  const post = async body => {
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({...body, key:teamKey})});
    let j; try { j = await r.json(); } catch(e) { throw {code:"서버 응답 오류"}; } if (!j.ok) throw {code:j.error || "error", detail:j.detail}; return j;
  };
  const apply = j => {
    COLS.forEach(c => data[c] = sortCol(c, j[c] || []));
    KVS.forEach(k => { if (j.kv && j.kv[k] != null) kv[k] = j.kv[k]; });
    lsSet("orbitte-cache", JSON.stringify(j)); paintAll();
  };
  const send = body => {
    pending++;
    queue = queue.then(() => post(body)).then(j => { pending--; if (!pending) apply(j); })
      .catch(e => { pending--; notice(e.code === "key" ? "비밀번호가 바뀜. 새로고침 후 다시 입력" : "저장 안 된 내용 있음. 연결 확인 필요"); if (!pending) refresh().catch(() => {}); });
    return Promise.resolve();
  };
  const refresh = async () => { if (pending) return; const j = await post({action:"all"}); if (!pending) apply(j); };
  return {
    refresh, apply,
    upload: async file => { const data = await shrink(file); const j = await post({action:"upload", name:(file.name || "photo").replace(/\.[^.]+$/,"") + ".jpg", mime:"image/jpeg", data}); return j.fileId; },
    add(col,row){ const id = newId(); data[col] = sortCol(col, [...data[col], {...row, id}]); paint(col); return send({action:"add", col, id, row}); },
    update(col,id,patch){ data[col] = data[col].map(r => r.id === id ? {...r, ...patch} : r); paint(col); return send({action:"update", col, id, patch}); },
    remove(col,id){ data[col] = data[col].filter(r => r.id !== id); paint(col); return send({action:"delete", col, id}); },
    setKV(k,v){ kv[k] = v; paintKV(k); return send({action:"kv", k, v}); }
  };
}
async function startSheets(){
  const sheet = makeSheetStore();
  const go = () => {
    store = sheet; paintAll();
    setInterval(() => { if (document.visibilityState === "visible") sheet.refresh().catch(() => {}); }, 30000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sheet.refresh().catch(() => {}); });
  };
  const askKey = msg => {
    $("#keyBox").style.display = "flex"; $("#keyMsg").textContent = msg || "";
    const ki = $("#keyInput"); ki.value = ""; setTimeout(() => ki.focus(), 50);
    ki.onkeydown = e => { if (e.key === "Enter") $("#keyGo").click(); };
    $("#keyGo").onclick = async () => {
      teamKey = $("#keyInput").value.trim(); if (!teamKey) return;
      try { await sheet.refresh(); lsSet("orbitte-key", teamKey); $("#keyBox").style.display = "none"; go(); syncWho(); }
      catch(e) { askKey(e.code === "key" ? "비밀번호가 맞지 않음" : "불러오기 실패. 잠시 후 다시 시도"); }
    };
  };
  if (!teamKey) return askKey();
  let started = false;
  try { const c = JSON.parse(lsGet("orbitte-cache") || "null"); if (c) { sheet.apply(c); go(); started = true; } } catch(e) {}
  try { await sheet.refresh(); if (!started) go(); }
  catch(e) { if (e.code === "key") { store = null; paintAll(); askKey("비밀번호가 바뀜. 다시 입력"); } else if (!started) notice("불러오기 실패. 새로고침 필요"); }
}

/* ===== 저장소: claude.ai ===== */
async function startClaude(){
  const db = await claude.use("db");
  if (!db) { notice("저장 기능 불러오기 실패. claude.ai 로그인 확인"); return; }
  const user = await claude.use("user");
  if (user) { const c = await user.can("data.write"); if (c === false) { canWrite = false; notice("보기 전용 권한. 글을 쓰려면 Contributor 이상 권한 필요"); } }
  store = {
    add: (col,row) => db.collection(col).doc(newId()).set(row),
    update: (col,id,patch) => db.collection(col).doc(id).update(patch),
    remove: (col,id) => db.collection(col).doc(id).delete(),
    setKV: (k,v) => { kv[k] = v; paintKV(k); return db.doc("kv/"+k).set({v}); }
  };
  paintAll();
  COLS.forEach(col => db.collection(col).onSnapshot(s => { data[col] = sortCol(col, s.docs.map(d => ({id:d.id, ...d.data()}))); paint(col); }, () => notice("데이터 불러오기 실패. 새로고침 필요")));
  KVS.forEach(k => db.doc("kv/"+k).onSnapshot(s => { if (s.exists && s.data().v != null) { kv[k] = s.data().v; paintKV(k); } }));
}

/* ===== 시작 ===== */
syncWho(); paintAll();
(async () => {
  if (/^https:/.test(API)) startSheets();
  else if (window.claude?.use) startClaude();
  else notice("index.html에 API 주소 없음");
})();
